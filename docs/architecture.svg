<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">SmartScan Node architecture</title>
  <desc id="d">At the edge, an HC-SR04 ultrasonic sensor on GPIO 5 and 18 is read by an ESP32-S3 running MicroPython every 5 seconds, with a 3-read debounce. The ESP32 publishes a JSON message over MQTT with TLS on port 8883 to AWS IoT Core on topic smartscan/presence. An IoT rule (SELECT * FROM smartscan/presence) invokes a Python 3.12 Lambda, which writes each message to the DynamoDB table smartscan-occupancy with a 30-day TTL and sends an SNS email only when the room changes between occupied and vacant. Lambda logs go to CloudWatch Logs, kept 14 days. All AWS parts are created with Terraform.</desc>
  <style>
    :root { --ink:#1f2937; --sub:#57606a; --line:#d0d7de; --card:#ffffff; --on:#0d9488; --tint:#f0fdfa; --group:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --card:#161b22; --on:#2dd4bf; --tint:#042f2e; --group:#0d1117; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size:13.5px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .sub   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .gt    { font-size:11.5px; font-weight:700; fill:var(--sub); letter-spacing:.05em; }
    .lbl   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .node  { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .db    { fill:var(--tint); stroke:var(--on); stroke-width:1.5; }
    .group { fill:var(--group); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .wire  { stroke:var(--line); stroke-width:1.5; fill:none; }
    .head  { fill:var(--line); }
    .dot   { fill:var(--on); }
    .flow  { stroke:var(--on); stroke-width:2; fill:none; stroke-dasharray:3 11; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-14; } }
    .t1 { animation: g1 6s infinite ease-in-out; }
    @keyframes g1 {
      0%,8%    { transform:translateX(88px); }
      25%,33%  { transform:translateX(251px); }
      50%,58%  { transform:translateX(483px); }
      75%,100% { transform:translateX(658px); }
    }
    @media (prefers-reduced-motion: reduce) { .t1, .flow { animation:none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
  </defs>

  <!-- groups -->
  <rect class="group" x="10" y="14" width="326" height="290" rx="14"/>
  <text class="gt" x="26" y="36">EDGE  (firmware/main.py)</text>
  <rect class="group" x="394" y="14" width="556" height="290" rx="14"/>
  <text class="gt" x="410" y="36">AWS us-east-1  (terraform/main.tf)</text>

  <!-- wires -->
  <g>
    <path class="wire" d="M152 140 H178" marker-end="url(#a)"/>
    <path class="wire" d="M322 140 H406" marker-end="url(#a)"/>
    <path class="wire" d="M558 140 H588" marker-end="url(#a)"/>
    <path class="wire" d="M726 140 C750 140 750 80 773 80" marker-end="url(#a)"/>  <path class="flow" d="M726 140 C750 140 750 80 771 80"/>
    <path class="wire" d="M726 140 C750 140 750 210 773 210" marker-end="url(#a)"/> <path class="flow" d="M726 140 C750 140 750 210 771 210"/>
    <path class="wire" d="M658 180 V226" marker-end="url(#a)"/>
  </g>
  <text class="lbl" x="365" y="124">MQTT</text>
  <text class="lbl" x="365" y="160">TLS :8883</text>
  <text class="lbl" x="573" y="130">rule</text>

  <!-- edge -->
  <rect class="node" x="24" y="100" width="128" height="80" rx="10"/>
  <text class="title" x="88" y="128">HC-SR04</text>
  <text class="sub" x="88" y="146">ultrasonic distance</text>
  <text class="sub" x="88" y="162">TRIG 5 · ECHO 18</text>

  <rect class="node" x="180" y="100" width="142" height="80" rx="10"/>
  <text class="title" x="251" y="128">ESP32-S3</text>
  <text class="sub" x="251" y="146">MicroPython · every 5 s</text>
  <text class="sub" x="251" y="162">3-read debounce</text>

  <text class="sub" x="173" y="220">Present = closer than 150 cm.</text>
  <text class="sub" x="173" y="236">Onboard LED (GPIO 2) shows the state.</text>

  <!-- cloud -->
  <rect class="node" x="408" y="100" width="150" height="80" rx="10"/>
  <text class="title" x="483" y="128">AWS IoT Core</text>
  <text class="sub" x="483" y="146">smartscan/presence</text>
  <text class="sub" x="483" y="162">rule: SELECT *</text>

  <rect class="node" x="590" y="100" width="136" height="80" rx="10"/>
  <text class="title" x="658" y="128">Lambda</text>
  <text class="sub" x="658" y="146">presence_handler.py</text>
  <text class="sub" x="658" y="162">Python 3.12</text>

  <rect class="db" x="775" y="40" width="160" height="80" rx="10"/>
  <text class="title" x="855" y="68">DynamoDB</text>
  <text class="sub" x="855" y="86">smartscan-occupancy</text>
  <text class="sub" x="855" y="102">on-demand · 30-day TTL</text>

  <rect class="node" x="775" y="170" width="160" height="80" rx="10"/>
  <text class="title" x="855" y="198">SNS email</text>
  <text class="sub" x="855" y="216">smartscan-alerts</text>
  <text class="sub" x="855" y="232">only when the state changes</text>

  <rect class="node" x="590" y="228" width="136" height="62" rx="10"/>
  <text class="title" x="658" y="254">CloudWatch Logs</text>
  <text class="sub" x="658" y="272">kept 14 days</text>

  <circle class="dot t1" cx="0" cy="100" r="5"/>

  <text class="sub" x="480" y="328">One JSON message every 5 s: device_id, distance_cm, occupied, state_changed, timestamp.</text>
</svg>
